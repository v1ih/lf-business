name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes
        run: npm test
      - name: Sintaxe dos arquivos JavaScript
        run: for f in js/*.js sw.js; do node --check "$f"; done
